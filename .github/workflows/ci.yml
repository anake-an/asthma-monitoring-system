name: CI

# Runs on every push and pull request. The NAS only deploys from main, so test
# changes on a branch and merge after this is green.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Laravel, in-memory SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gmp, curl, openssl, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml forces in-memory SQLite and tests/TestCase.php refuses anything else.
      - name: Run tests
        run: php artisan test

  migrations:
    name: Migrations on MySQL 8 (same engine as production)
    runs-on: ubuntu-latest
    services:
      mysql:
        # The official mysql image via AWS's public mirror: Docker Hub rate-limits pulls from the
        # shared GitHub runner IPs ("toomanyrequests").
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: asthma_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: asthma_db
      DB_USERNAME: root
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gmp, curl, openssl, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Column changes (->change(), charset) behave differently on MySQL than on SQLite.
      - name: Migrate, then roll back and re-apply the last two twice
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=2 --force
          php artisan migrate --force
          php artisan migrate:rollback --step=2 --force
          php artisan migrate --force
          php artisan migrate:status

  frontend:
    name: Frontend type check and build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Dashboard version matches /VERSION
        run: |
          shown=$(grep -o '"[0-9][0-9.]*"' lib/version.ts | tr -d '"')
          test "$shown" = "$(tr -d '[:space:]' < ../VERSION)" || { echo "lib/version.ts says $shown, VERSION says $(cat ../VERSION)"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The bar and headline colours come from lib/readingStatus.ts; Tailwind only generates classes
      # it finds in its content paths, and amber once went missing (invisible "near the limit" bars).
      - name: Status colours are in the built CSS
        run: |
          for c in bg-emerald-400 bg-amber-400 bg-red-400; do
            grep -rqF ".$c{" .next/static/css || { echo "missing CSS class $c"; exit 1; }
          done

  firmware-esp32:
    name: ESP32 firmware compiles (core ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['2.0.17', 'latest']
    steps:
      - uses: actions/checkout@v5

      # secrets.h is gitignored; compile against the example values.
      - name: Use example secrets
        run: cp hardware/esp32_firmware/secrets.example.h hardware/esp32_firmware/secrets.h

      - uses: arduino/compile-sketches@v1
        with:
          # Minimal SPIFFS: 1.9 MB per app with OTA (the default 1.2 MB is too small for updates over Wi-Fi)
          fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              ${{ matrix.core != 'latest' && format('version: {0}', matrix.core) || '' }}
          libraries: |
            - name: WiFiManager
            - name: ArduinoJson
            - name: DHT sensor library
            - name: Adafruit Unified Sensor
            - name: LiquidCrystal I2C
          sketch-paths: |
            - hardware/esp32_firmware
          enable-deltas-report: false

  firmware-pico:
    name: Pico firmware compiles (arduino-pico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/compile-sketches@v1
        with:
          # 1 MB for the sketch and 1 MB of file system: the file system receives cloud updates
          fqbn: rp2040:rp2040:rpipico:flash=2097152_1048576
          platforms: |
            - name: rp2040:rp2040
              source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          # Finds both sketches: pico_cough_ai and data_collection/
          sketch-paths: |
            - hardware/pico_cough_ai
          enable-deltas-report: false

  ai_engine:
    name: AI engine (install and syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_engine
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ai_engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: AI limits never inside the room's normal range
        env:
          MODEL_DIR: /tmp/models
        run: python test_thresholds.py

      - name: Only rescue doses are episodes; controller doses are an input
        env:
          MODEL_DIR: /tmp/models
        run: python test_dataset.py

      - name: Model choice and honest evaluation (recall / precision, no accuracy)
        env:
          MODEL_DIR: /tmp/models
        run: python test_training.py

      # Regression test: a password with '@' once made the engine connect to host '...@db'.
      - name: Database URL keeps special characters in the password
        env:
          DB_USERNAME: respiro
          DB_PASSWORD: 'p@ss:w/rd#1'
          MODEL_DIR: /tmp/models
        run: >
          python -c "import main; u = main.engine.url;
          assert (u.username, u.password, u.host, u.database) == ('respiro', 'p@ss:w/rd#1', 'db', 'asthma_db'), repr(u);
          print('ok', repr(u))"

  # Cloud firmware updates: when a push to main changes the ESP32 firmware or the Edge AI (Pico)
  # build, build it (the ESP32 one with the real broker settings from GitHub secrets) and upload it
  # to the server, where owners then see "Update". The ESP32 .bin contains the device password, so
  # nothing is stored as an artifact or a release. Skipped (with a note) until the secrets are set;
  # the server ignores a version it already has.
  firmware-deploy:
    name: Publish firmware to the server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [firmware-esp32, firmware-pico]
    runs-on: ubuntu-latest
    env:
      ESP32_FQBN: esp32:esp32:esp32:PartitionScheme=min_spiffs
      PICO_FQBN: rp2040:rp2040:rpipico:flash=2097152_1048576
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      PICO_INDEX: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
      MQTT_URI: ${{ secrets.MQTT_URI }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      UPLOAD_URL: ${{ secrets.FIRMWARE_UPLOAD_URL }}
      UPLOAD_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
      TZ: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: the build stamp counts today's builds

      - name: What changed, and are the secrets set?
        id: check
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          if [ -z "$UPLOAD_TOKEN" ] || [ -z "$UPLOAD_URL" ]; then
            echo "::notice::The GitHub secrets for publishing firmware are not set (see hardware/README.md)."
            exit 0
          fi
          if echo "$changed" | grep -q '^hardware/esp32_firmware/'; then
            if [ -z "$MQTT_URI" ] || [ -z "$MQTT_PASSWORD" ]; then
              echo "::notice::ESP32 firmware changed, but MQTT_URI / MQTT_PASSWORD secrets are not set."
            else
              echo "esp32=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if echo "$changed" | grep -q '^hardware/pico_cough_ai/'; then echo "pico=true" >> "$GITHUB_OUTPUT"; fi
          echo "$changed" | grep -qE '^hardware/(esp32_firmware|pico_cough_ai)/' || echo "No firmware changed in this push: nothing to publish."

      - uses: arduino/setup-arduino-cli@v2
        if: steps.check.outputs.esp32 == 'true' || steps.check.outputs.pico == 'true'

      - name: Build the ESP32 firmware with the real broker settings
        if: steps.check.outputs.esp32 == 'true'
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install WiFiManager ArduinoJson "DHT sensor library" "Adafruit Unified Sensor" "LiquidCrystal I2C"
          umask 077
          {
            echo '#pragma once'
            printf '#define MQTT_URI "%s"\n' "$MQTT_URI"
            printf '#define MQTT_USERNAME "%s"\n' "${MQTT_USERNAME:-respirosync_device}"
            printf '#define MQTT_PASSWORD "%s"\n' "$MQTT_PASSWORD"
          } > hardware/esp32_firmware/secrets.h
          BUILD=$(.github/firmware-build-stamp.sh hardware/esp32_firmware)
          echo "#define FIRMWARE_BUILD \"$BUILD\"" > hardware/esp32_firmware/build_info.h
          echo "ESP32 firmware build $BUILD"
          arduino-cli compile --fqbn "$ESP32_FQBN" --output-dir build-esp32 hardware/esp32_firmware
          rm hardware/esp32_firmware/secrets.h hardware/esp32_firmware/build_info.h

      - name: Build the Edge AI (Pico) firmware
        if: steps.check.outputs.pico == 'true'
        run: |
          arduino-cli core update-index --additional-urls "$PICO_INDEX"
          arduino-cli core install rp2040:rp2040 --additional-urls "$PICO_INDEX"
          BUILD=$(.github/firmware-build-stamp.sh hardware/pico_cough_ai)
          echo "#define EDGE_AI_BUILD \"$BUILD\"" > hardware/pico_cough_ai/build_info.h
          echo "Edge AI build $BUILD"
          arduino-cli compile --fqbn "$PICO_FQBN" --output-dir build-pico hardware/pico_cough_ai
          rm hardware/pico_cough_ai/build_info.h

      - name: Upload to the server
        if: steps.check.outputs.esp32 == 'true' || steps.check.outputs.pico == 'true'
        run: |
          # "What's new" for owners: the lines of the folder's WHATS_NEW.txt (joined by |), else the PR title.
          publish() {
            folder=$1; file=$2
            [ -f "$file" ] || return 0
            notes=$(grep -v '^[[:space:]]*#' "$folder/WHATS_NEW.txt" 2>/dev/null | sed '/^[[:space:]]*$/d' | paste -sd'|' -)
            [ -n "$notes" ] || notes=$(git log -1 --pretty=%b | head -n 1)
            curl --fail-with-body -sS -X POST "$UPLOAD_URL" \
              -H "Authorization: Bearer $UPLOAD_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "X-Firmware-Notes: ${notes:0:480}" \
              -A "RespiroSync-CI" \
              --data-binary @"$file"
            echo
          }
          publish hardware/esp32_firmware build-esp32/esp32_firmware.ino.bin
          publish hardware/pico_cough_ai build-pico/pico_cough_ai.ino.bin
          rm -rf build-esp32 build-pico
