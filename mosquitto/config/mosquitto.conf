# RespiroSync Mosquitto broker
#
# Anonymous access is disabled on every listener. Two accounts exist, both
# created on the server with mosquitto_passwd (the password file is NOT in git):
#   respirosync_backend  - Laravel API, MQTT worker and scheduler (full project access)
#   respirosync_device   - shared by all ESP32 units, restricted by the ACL below
#
# Create/refresh the password file on the NAS (see README "Broker credentials").

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Internal listener: only reachable from the Docker network (and 127.0.0.1:1884 on the host)
listener 1883

# WebSocket listener: published to the internet through the Cloudflare Tunnel (wss://mqtt.respirosync.online)
listener 9001
protocol websockets
